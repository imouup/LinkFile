[project]
name = "linkfile-api"
version = "0.1.0"
description = "FastAPI backend for LinkFile online sharing, metadata, sync, and server local-storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "linkfile-core",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkfile_api"]

[tool.uv.sources]
linkfile-core = { workspace = true }
