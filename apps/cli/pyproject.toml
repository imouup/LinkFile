[project]
name = "linkfile-cli"
version = "0.1.1"
description = "Offline-first LinkFile command line interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "httpx>=0.28.0",
  "linkfile-core",
  "rich>=13.9.0",
  "typer>=0.15.0",
]

[project.scripts]
linkfile = "linkfile_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkfile_cli", "storage"]

[tool.uv.sources]
linkfile-core = { workspace = true }
