[project]
name = "linkfile"
version = "0.1.2"
description = "LinkFile: offline-first BYOS file sharing CLI, API, web app, and Python SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/cli",
  "packages/py-core",
  "packages/py-sdk",
]

[dependency-groups]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "apps/cli/tests",
  "packages/py-core/tests",
  "packages/py-sdk/tests",
]
