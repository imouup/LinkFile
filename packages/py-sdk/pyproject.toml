[project]
name = "linkfile"
version = "0.1.0"
description = "Python SDK for LinkFile online and local clients."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "linkfile-core",
  "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkfile"]

[tool.uv.sources]
linkfile-core = { workspace = true }
