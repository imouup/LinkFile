[project]
name = "linkfile-core"
version = "0.1.2"
description = "Shared LinkFile core primitives for config, storage backends, crypto, local index, and local-server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "pydantic>=2.10.0",
  "platformdirs>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkfile_core"]
